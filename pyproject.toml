[project]
name = "espo-voice-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pankaj Beniwal", email = "pankajbeniwal3112@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "livekit-agents[deepgram,elevenlabs,openai,silero,turn-detector]>=1.9.0",
    "livekit-api>=1.2.3",
    "livekit-plugins-noise-cancellation>=0.3.3",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "playwright>=1.65.2",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
espo-voice-agent = "espo_voice_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
